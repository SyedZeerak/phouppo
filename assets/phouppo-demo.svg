<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes scanline { 0% { transform: translateY(0); } 100% { transform: translateY(440px); } }
      @keyframes pulseBadge { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.85; transform: scale(0.98); } }
      @keyframes fadeIn1 { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes fadeIn2 { 0%, 15% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes fadeIn3 { 0%, 30% { opacity: 0; } 45% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes fadeIn4 { 0%, 50% { opacity: 0; } 65% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes fadeIn5 { 0%, 70% { opacity: 0; } 85% { opacity: 1; } 100% { opacity: 1; } }

      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .cursor { animation: blink 1s infinite; }
      .scanner { animation: scanline 4s linear infinite; }
      .badge-glow { animation: pulseBadge 2.5s ease-in-out infinite; transform-origin: center; }
      .step-1 { animation: fadeIn1 8s ease-in forwards infinite; }
      .step-2 { animation: fadeIn2 8s ease-in forwards infinite; }
      .step-3 { animation: fadeIn3 8s ease-in forwards infinite; }
      .step-4 { animation: fadeIn4 8s ease-in forwards infinite; }
      .step-5 { animation: fadeIn5 8s ease-in forwards infinite; }
    </style>
  </defs>

  <!-- Outer Glow & Window Border -->
  <rect x="10" y="10" width="880" height="500" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2"/>

  <!-- Window Header -->
  <path d="M 10 26 A 16 16 0 0 1 26 10 L 874 10 A 16 16 0 0 1 890 26 L 890 52 L 10 52 Z" fill="url(#header-grad)" />
  <line x1="10" y1="52" x2="890" y2="52" stroke="#374151" stroke-width="1"/>

  <!-- Window Control Dots -->
  <circle cx="34" cy="31" r="6.5" fill="#ef4444" />
  <circle cx="54" cy="31" r="6.5" fill="#f59e0b" />
  <circle cx="74" cy="31" r="6.5" fill="#10b981" />

  <!-- Window Title -->
  <text x="450" y="36" fill="#9ca3af" font-size="13" font-weight="600" text-anchor="middle" class="mono">
    ⚡ phouppo audit &mdash; interactive visual artifact runtime
  </text>

  <!-- Interactive Status Pill -->
  <g transform="translate(730, 21)">
    <rect width="135" height="20" rx="10" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <circle cx="12" cy="10" r="3.5" fill="#34d399"/>
    <text x="73" y="14" fill="#a7f3d0" font-size="10.5" font-weight="600" text-anchor="middle" class="mono">READ-ONLY MODE</text>
  </g>

  <!-- Terminal Content -->
  <g transform="translate(35, 80)" class="mono">
    <!-- Prompt Command -->
    <text x="0" y="20" fill="#06b6d4" font-size="14" font-weight="bold">$</text>
    <text x="18" y="20" fill="#f3f4f6" font-size="14" font-weight="bold">phouppo . --depth standard --mode static</text>

    <!-- Phase 0 -->
    <g class="step-1" transform="translate(0, 48)">
      <text x="0" y="0" fill="#60a5fa" font-size="13" font-weight="bold">🔍 Phase 0: Reconnaissance</text>
      <text x="210" y="0" fill="#9ca3af" font-size="12.5">(completed in 4 tool calls)</text>
      <text x="20" y="22" fill="#d1d5db" font-size="12">├─ Stack: Next.js 14 (App Router), Supabase Auth, PostgreSQL, TailwindCSS</text>
      <text x="20" y="42" fill="#d1d5db" font-size="12">└─ Environment: 41 routes detected &bull; TypeScript strict &bull; Migrations present</text>
    </g>

    <!-- Phase 1 -->
    <g class="step-2" transform="translate(0, 118)">
      <text x="0" y="0" fill="#a78bfa" font-size="13" font-weight="bold">⚡ Phase 1: 10-Point Triage</text>
      <text x="20" y="22" fill="#34d399" font-size="12">[PASS] Check 1: Secrets scan &bull; No unmasked credentials in repo</text>
      <text x="20" y="42" fill="#f87171" font-size="12" font-weight="bold">[FAIL] Check 2: Server-side Auth & IDOR &bull; route id query unverified</text>
      <text x="20" y="62" fill="#fbbf24" font-size="12">[FAIL] Check 5: Financial calculations &bull; IEEE 754 floats used for tax</text>
      <text x="20" y="82" fill="#34d399" font-size="12">[PASS] Check 3: Database RLS &bull; Supabase row policies active</text>
    </g>

    <!-- Phase 2 & 3 Artifact Generation -->
    <g class="step-3" transform="translate(0, 230)">
      <text x="0" y="0" fill="#ec4899" font-size="13" font-weight="bold">📑 Phase 3: Interactive Visual Artifact Generated</text>
      <text x="350" y="0" fill="#a7f3d0" font-size="12" font-weight="bold">➜ audit-report.md</text>
    </g>

    <!-- Interactive Artifact Card Preview -->
    <g class="step-4" transform="translate(0, 248)">
      <rect width="830" height="150" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.5"/>

      <!-- Card Banner -->
      <g transform="translate(16, 16)">
        <rect width="250" height="26" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1" class="badge-glow"/>
        <text x="125" y="17.5" fill="#fecaca" font-size="11.5" font-weight="bold" text-anchor="middle">🛑 VERDICT: NOT READY FOR PROD</text>
      </g>

      <g transform="translate(280, 16)">
        <rect width="180" height="26" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
        <text x="90" y="17.5" fill="#bfdbfe" font-size="11.5" font-weight="bold" text-anchor="middle">📊 SCORECARD: 4 FLAGGED</text>
      </g>

      <!-- Accordion Line Preview -->
      <g transform="translate(16, 60)">
        <text x="0" y="0" fill="#f87171" font-size="12.5" font-weight="bold">▼ [CRITICAL] [SEC-01] IDOR in Distributor Payout Route</text>
        <text x="440" y="0" fill="#94a3b8" font-size="11.5">Effort: &lt;1h &bull; Verified: Static</text>
        <text x="20" y="20" fill="#cbd5e1" font-size="11.5">Location: apps/portal/api/payouts/[id].ts:42</text>
        <text x="20" y="38" fill="#38bdf8" font-size="11.5">Fix: Scope query to tenant &mdash; where: { id: req.query.id, orgId: req.user.orgId }</text>
      </g>

      <!-- Task Punchlist Preview -->
      <g transform="translate(16, 122)">
        <text x="0" y="0" fill="#10b981" font-size="12" font-weight="bold">✔ Punch List: [ ] Fix [SEC-01]  [ ] Fix [DAT-01]  [ ] Attach Rate Limiting</text>
        <text x="700" y="0" fill="#67e8f9" font-size="11.5" font-style="italic">[Interactive .md]</text>
      </g>
    </g>

    <!-- Blinking Cursor -->
    <g class="step-5" transform="translate(0, 412)">
      <text x="0" y="0" fill="#10b981" font-size="13" font-weight="bold">phouppo audit completed in 2.8s.</text>
      <text x="260" y="0" fill="#38bdf8" font-size="13">Review side-by-side in your agent's artifact panel</text>
      <rect x="660" y="-12" width="8" height="15" fill="#38bdf8" class="cursor"/>
    </g>
  </g>
</svg>
